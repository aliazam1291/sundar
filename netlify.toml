# Netlify build config.
#
# The Next.js app sits at the repo root, which is what Netlify assumes by
# default — so there is no `base` here on purpose. Do not set a "Base
# directory" in the Netlify UI either; a UI value overrides this file.
#
# `publish` is deliberately not set: @netlify/plugin-nextjs points it at the
# right build output itself, and hand-setting it is a common way to end up
# serving nothing and 404ing.

[build]
  command = "npm run build"

[build.environment]
  # Next 16 / React 19 need a modern Node; Netlify's default can lag.
  NODE_VERSION = "22"

# Required. /shop is server-rendered on demand (it awaits `searchParams` to
# filter by range), so this cannot be a static-only deploy — the runtime has
# to be present for that route and for next/image.
[[plugins]]
  package = "@netlify/plugin-nextjs"
